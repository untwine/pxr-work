name: test-linux

on:
  push:
    branches: [ dev, main ]

  workflow_dispatch:

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: True
  CONAN_REMOTE_NAME: untwine
  CONAN_REMOTE_URL: https://packages.untwine-openusd.dev/repository/conan/

jobs:
  test-linux:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        os: [ linux-intel, linux-arm ]
        include:
          - os: linux-intel
            runs-on: ubuntu-latest
          - os: linux-arm
            runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Install Ninja
        run: |
          sudo apt update
          sudo apt install -y ninja-build

      - name: Set up Conan
        shell: bash
        run: |
          pip install conan
          conan profile detect
          conan remote add "$CONAN_REMOTE_NAME" "$CONAN_REMOTE_URL" --force

      - name: Build
        shell: bash
        run: >
          conan build .
          -o build_tests=True
          -o python_version=3.12
          --options=*:shared=True
          -c tools.cmake.cmaketoolchain:generator=Ninja
          --build=missing

      - name: Test
        run: ctest --preset conan-release -VV --timeout 3600
